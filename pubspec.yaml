name: cch3r1_messanger
description: Личный мессенджер с чатами, группами и вложениями на Flutter + Supabase.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # State / DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Local DB
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Images
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2

  # Utils
  connectivity_plus: ^6.0.3
  # dynamic_color 1.8.x требует Flutter 3.27+ (Color.toARGB32).
  # 1.7.0 был запинен из-за старого Flutter, теперь используем актуальную
  # версию, иначе Kotlin-плагин ломает Java-GeneratedPluginRegistrant.
  dynamic_color: ^1.8.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

  # Settings / preferences
  shared_preferences: ^2.3.0

  # GIF / Notifications
  http: ^1.2.0
  flutter_local_notifications: ^17.2.0

  # Admin: device fingerprint (Android ID для привязки админки к устройству).
  device_info_plus: ^10.1.2

  # Attachments
  file_picker: ^8.1.2
  mime: ^1.0.5
  permission_handler: ^11.3.1
  record: ^5.1.2
  just_audio: ^0.9.40
  video_player: ^2.9.1
  open_filex: ^4.5.0

  # Сохранение фото-вложений в системную галерею.
  gal: ^2.3.0

dependency_overrides:
  # record 5.2.1 транзитивно тянет record_linux 0.7.2, который не реализует
  # новые члены record_platform_interface 1.5.0 → ошибка компиляции даже
  # для Android. Принудительно поднимаем record_linux до совместимой версии.
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
